name: Lint check

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, synchronize, reopened]
        branches: [main]

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/setup-repo
            - name: Lint
              run: |
                  echo "::group::Lint"
                  pnpm lint:check
                  echo "::endgroup::"

    format:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/setup-repo
            - name: Format
              id: check_format
              continue-on-error: true
              run: |
                  echo "::group::Format"
                  pnpm format:check
                  echo "::endgroup::"

            - name: Fix formatting if check failed
              if: steps.check_format.outcome == 'failure'
              run: pnpm format:fix

            - name: Fix formatting
              if: steps.check_format.outcome == 'failure'
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  commit_message: "style: automated format fix"
                  commit_user_name: "github-actions[bot]"
                  commit_user_email: "github-actions[bot]@users.noreply.github.com"

            - name: Fail step if formatting had to be fixed
              if: steps.check_format.outcome == 'failure'
              run: |
                  echo "Code formatting issues were detected and auto-fixed."
                  exit 1
